<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기권의 층상구조</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1d2733;--sub:#5b6878;--line:#d5dce6;--curve:#e24b3c;
--c1:#cfe8ff;--c2:#d9f0d6;--c3:#fff1c9;--c4:#f6d5e3;--sel:#1f6feb;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#1a232d;--text:#e8edf3;--sub:#9aa8b8;--line:#33414f;--curve:#ff7a6b;
--c1:#1f3a54;--c2:#24402a;--c3:#4a3f1e;--c4:#4a2536;--sel:#5aa2ff;}}
:root[data-theme="dark"]{--bg:#10161d;--card:#1a232d;--text:#e8edf3;--sub:#9aa8b8;--line:#33414f;--curve:#ff7a6b;
--c1:#1f3a54;--c2:#24402a;--c3:#4a3f1e;--c4:#4a2536;--sel:#5aa2ff;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
h1{font-size:1.3rem;margin:16px 0 4px}
p.hint{margin:0 0 12px;color:var(--sub);font-size:.9rem}
.wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start;max-width:980px;margin:0 auto}
@media(max-width:700px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--text);font-family:inherit}
.layer{cursor:pointer}
.layer rect.bg{transition:opacity .2s;opacity:.85}
.layer:hover rect.bg{opacity:1}
.layer.active rect.bg{opacity:1;stroke:var(--sel);stroke-width:3}
.layer .name{font-size:15px;font-weight:700}
.axis{stroke:var(--sub);stroke-width:1.5}
.tick{font-size:11px;fill:var(--sub)}
.grid{stroke:var(--line);stroke-dasharray:3 3}
.curve{fill:none;stroke:var(--curve);stroke-width:3.5;stroke-linejoin:round}
.pause{font-size:10px;fill:var(--sub)}
#info h2{margin:4px 0 2px;font-size:1.2rem}
#info .range{display:inline-block;background:var(--sel);color:#fff;border-radius:99px;padding:2px 10px;font-size:.85rem;margin-bottom:8px}
#info ul{margin:0;padding-left:20px;line-height:1.7}
#info li{list-style:none;margin-left:-20px}
#info .it{width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:6px 4px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
#info .it:hover{background:var(--bg)}
#info .it .arr{color:var(--sel);font-size:.8rem;transition:transform .2s}
#info li.open .arr{transform:rotate(180deg)}
#info .why{display:none;margin:2px 4px 8px;padding:8px 10px;border-left:3px solid var(--sel);background:var(--bg);border-radius:6px;font-size:.92rem;color:var(--sub);line-height:1.5}
#info li.open .why{display:block}
#info .tw.open .why{display:block}
#info .trend .tgl{font-weight:400;font-size:.8rem;margin-left:8px;opacity:.9}
#info .trend{border:0;font-family:inherit;cursor:pointer;display:block;width:fit-content;margin-top:4px;font-weight:700;font-size:.9rem;padding:5px 12px;border-radius:8px;margin-bottom:6px}
#info .trend.up{background:var(--curve);color:#fff}
#info .trend.down{background:var(--sel);color:#fff}
.special{cursor:pointer}
.special .ozb{fill:#2fa36b;fill-opacity:.4;stroke:#2fa36b;stroke-width:2;transition:fill-opacity .2s}
.special:hover .ozb{fill-opacity:.6}
.special.active .ozb{stroke:var(--sel);stroke-width:3.5;fill-opacity:.6}
.special .kvis{stroke:var(--sel);stroke-width:2.5;stroke-dasharray:6 4}
.special.active .kvis{stroke-width:4}
.special .stxt{font-size:12px;font-weight:700}
#info .back{margin-top:12px;background:none;border:1px solid var(--line);border-radius:8px;color:var(--sel);font:inherit;padding:6px 10px;cursor:pointer}
.altbox{display:flex;gap:8px;align-items:center;max-width:980px;margin:0 auto 6px}
.altbox label{font-weight:700}
.altbox input{flex:1;min-width:0;max-width:200px;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.altbox button{font:inherit;font-weight:700;padding:8px 14px;border:0;border-radius:8px;background:var(--sel);color:#fff;cursor:pointer}
#altmsg{max-width:980px;margin:0 auto 10px;color:var(--curve);font-size:.9rem;min-height:1.2em}
#info .res{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
#info .res .big{font-weight:700;font-size:1.05rem}
#info .res .sm{color:var(--sub);font-size:.85rem}
#info .res .go{color:var(--sel);padding:2px 0}
#info .plain{padding:6px 4px;display:block}
#info .empty{color:var(--sub);padding:20px 8px;text-align:center}
</style>
</head>
<body>
<h1>🌍 기권의 층상구조</h1>
<p class="hint">고도를 입력하면 그 고도의 기권과 설명이 나와요. 그래프의 층을 눌러도 돼요.</p>
<div class="altbox"><label for="alt">고도</label><input id="alt" type="number" inputmode="decimal" min="0" max="1000" step="any" placeholder="예: 25"><span>km</span><button id="altgo">확인</button></div>
<div id="altmsg"></div>
<div class="wrap">
 <div class="card">
  <svg viewBox="0 0 500 520" id="chart" role="img" aria-label="고도에 따른 기온 변화 그래프"></svg>
 </div>
 <div class="card" id="info"><div class="empty">🔎 고도를 입력하거나 층을 눌러 보세요.</div></div>
</div>

<script>
const layers=[
 {id:"thermo",trend:"up",trendWhy:"태양 복사 에너지를 직접 흡수하기 때문이에요. (공기가 매우 희박해 태양의 강한 자외선·X선을 바로 받아요.)",name:"열권",range:"80~1000km",color:"--c4",y0:80,y1:1000,
  items:[["인공위성 진입","공기가 매우 희박해 마찰이 거의 없어서 위성이 오래 궤도를 도는 데 유리해요."],["오로라 발생","태양에서 날아온 전기를 띤 입자가 지구 극지방으로 들어와 열권의 공기와 부딪혀 빛을 내요."],{sp:"karman",text:"카르만 선(100km, 우주의 경계)"}]},
 {id:"meso",trend:"down",trendWhy:"지구 복사 에너지로부터 멀어지기 때문이에요.",name:"중간권",range:"50~80km",color:"--c3",y0:50,y1:80,
  items:["대류 현상 존재",["기상현상 없음","수증기가 없어서 구름·비 같은 기상현상이 일어나지 않아요."],["유성 발광","우주에서 날아온 작은 암석이 빠른 속도로 공기와 부딪혀 뜨겁게 타면서 빛을 내요. 중간권에서는 대부분 이 높이에서 타서 보이지요."]]},
 {id:"strato",trend:"up",trendWhy:"오존층이 태양의 자외선을 흡수해 열을 내기 때문이에요.",name:"성층권",range:"11~50km",color:"--c2",y0:11,y1:50,
  items:[{sp:"ozone",text:"오존층(20~30km)"},["대기가 안정적","위로 갈수록 기온이 높아져서 아래의 찬 공기가 위로 올라가지 못해 대류가 일어나지 않아요."],["고고도 자율 비행 드론 및 제트기 운항","대기가 안정적이라 비행하기에 좋아요."]]},
 {id:"tropo",trend:"down",trendWhy:"지구 복사 에너지로부터 멀어지기 때문이에요.",name:"대류권",range:"0~11km",color:"--c1",y0:0,y1:11,
  items:["대기 질량의 75% 집중",["대류 현상 및 기상현상","대류권에는 수증기가 있어서 구름·비·눈 같은 기상현상이 일어나요."],"상업용 여객기 주요 운항"]}
];
// 그래프 영역
const L=60,R=480,T=20,B=480; // x: 온도, y: 고도
const tMin=-100,tMax=100;
const X=t=>L+(t-tMin)/(tMax-tMin)*(R-L);
// 시각화를 위한 고도 구간 압축(구간 비율 고정): 0-11, 11-50, 50-80, 80-1000
const bounds=[0,11,50,80,100,1000];
const pix=[B,B-80,B-210,B-310,B-350,T]; // 각 경계의 y 픽셀
function Y(h){
 for(let i=0;i<5;i++){ if(h<=bounds[i+1]){const f=(h-bounds[i])/(bounds[i+1]-bounds[i]);return pix[i]+(pix[i+1]-pix[i])*f;} }
 return T;
}
// 대표 온도 곡선 (고도 km, 온도 ℃)
const pts=[[0,15],[11,-55],[20,-55],[32,-40],[50,0],[80,-90],[100,-70],[300,60],[600,90],[1000,100]];
const s=document.getElementById('chart');
let h='';
// 층 배경
layers.forEach(l=>{
 const ya=Y(l.y1),yb=Y(l.y0);
 h+=`<g class="layer" data-id="${l.id}" tabindex="0" role="button" aria-label="${l.name}">
  <rect class="bg" x="${L}" y="${ya}" width="${R-L}" height="${yb-ya}" fill="var(${l.color})"/>
  <text class="name" x="${L+10}" y="${(ya+yb)/2+5}">${l.name}</text></g>`;
});
// 격자 & 축
for(let t=-100;t<=100;t+=50){h+=`<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${B}"/><text class="tick" x="${X(t)}" y="${B+16}" text-anchor="middle">${t}</text>`;}
[0,11,20,30,50,80,100,1000].forEach(a=>{h+=`<text class="tick" x="${L-6}" y="${Y(a)+4}" text-anchor="end">${a}</text>`;});
h+=`<line class="axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/>`;
h+=`<text class="tick" x="${(L+R)/2}" y="${B+36}" text-anchor="middle" style="font-size:13px">온도 (℃)</text>`;
h+=`<text class="tick" transform="translate(14 ${(T+B)/2}) rotate(-90)" text-anchor="middle" style="font-size:13px">고도 (km)</text>`;
// 경계(계면) 점선 라벨
[[11,"대류권계면"],[50,"성층권계면"],[80,"중간권계면"]].forEach(([a,n])=>{
 h+=`<text class="pause" x="${R-4}" y="${Y(a)-3}" text-anchor="end">${n}</text>`;});
// 카르만선
h+=`<g class="special" data-sp="karman" tabindex="0" role="button" aria-label="카르만 선"><line x1="${L}" x2="${R}" y1="${Y(100)}" y2="${Y(100)}" stroke="transparent" stroke-width="14"/><line class="kvis" x1="${L}" x2="${R}" y1="${Y(100)}" y2="${Y(100)}"/>
<text class="stxt" x="${L+6}" y="${Y(100)-6}" text-anchor="start" style="fill:var(--sel)">카르만 선 ›</text></g>`;
// 오존층 표시
h+=`<g class="special" data-sp="ozone" tabindex="0" role="button" aria-label="오존층"><rect class="ozb" x="${L}" y="${Y(30)}" width="${R-L}" height="${Y(20)-Y(30)}"/>`;
h+=`<text class="stxt" x="${R-8}" y="${Y(25)+4}" text-anchor="end">오존층 (20~30km) ›</text></g>`;
// 곡선
h+=`<polyline class="curve" pointer-events="none" points="${pts.map(p=>X(p[1])+','+Y(p[0])).join(' ')}"/>`;
h+='<g id="mk" pointer-events="none"></g>';
s.innerHTML=h;

const info=document.getElementById('info');
function show(id,keep){
 if(!keep)clearMarker();
 const l=layers.find(x=>x.id===id);
 document.querySelectorAll('.layer').forEach(g=>g.classList.toggle('active',g.dataset.id===id));
 document.querySelectorAll('.special').forEach(g=>g.classList.remove('active'));
 info.innerHTML=`<h2>${l.name}</h2><div class="tw"><button class="trend ${l.trend}">${l.trend==='up'?'▲ 고도가 높아질수록 기온 상승':'▼ 고도가 높아질수록 기온 하강'}<span class="tgl">▾</span></button><div class="why">💡 ${l.trendWhy}</div></div><span class="range">${l.range}</span><ul>${l.items.map(i=>Array.isArray(i)?`<li><button class="it"><span>${i[0]}</span><span class="arr">▼</span></button><div class="why">💡 ${i[1]}</div></li>`:typeof i==='object'?`<li><button class="it go" data-sp="${i.sp}"><span>${i.text}</span><span class="arr" style="transform:none">›</span></button></li>`:`<li><span class="plain">${i}</span></li>`).join('')}</ul><p class="hint" style="margin-top:10px">▼ 누르면 이유가 나오고, › 누르면 자세한 설명이 나와요.</p>`;
 info.querySelectorAll('.go').forEach(b=>b.addEventListener('click',()=>showSpecial(b.dataset.sp)));
 info.querySelectorAll('.trend').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));
 info.querySelectorAll('.it').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));
}
document.querySelectorAll('.layer').forEach(g=>{
 g.addEventListener('click',()=>show(g.dataset.id));
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g.dataset.id);}});
});
const specials={
 ozone:{name:"오존층",range:"20~30km",back:"strato",items:["오존(O₃)이 많이 모여 있는 층이에요. (성층권 안)","태양의 해로운 자외선을 흡수해 생명체를 보호해요.","자외선을 흡수하면서 열이 나서, 성층권은 위로 갈수록 기온이 높아져요."]},
 karman:{name:"카르만 선",range:"100km",back:"thermo",items:["대기권과 우주를 나누는 경계로, 이 높이부터를 우주로 봐요.","공기가 너무 희박해서 비행기가 뜰 수 없어요."]}
};
function showSpecial(id){
 clearMarker();
 const p=specials[id];
 document.querySelectorAll('.layer').forEach(g=>g.classList.remove('active'));
 document.querySelectorAll('.special').forEach(g=>g.classList.toggle('active',g.dataset.sp===id));
 info.innerHTML=`<h2>${p.name}</h2><span class="range">${p.range}</span><ul>${p.items.map(i=>`<li><span class="plain">• ${i}</span></li>`).join('')}</ul><button class="back">← ${layers.find(x=>x.id===p.back).name}으로 돌아가기</button>`;
 info.querySelector('.back').addEventListener('click',()=>show(p.back));
}
document.querySelectorAll('.special').forEach(g=>{
 g.addEventListener('click',()=>showSpecial(g.dataset.sp));
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showSpecial(g.dataset.sp);}});
});
function tempAt(h){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(h<=b[0])return a[1]+(b[1]-a[1])*(h-a[0])/(b[0]-a[0]);}return pts[pts.length-1][1];}
function layerAt(h){return h<11?'tropo':h<50?'strato':h<80?'meso':'thermo';}
function clearMarker(){const m=document.getElementById('mk');if(m)m.innerHTML='';}
function drawMarker(h,t){
 const y=Y(h),x=X(t),flip=x>R-90;
 document.getElementById('mk').innerHTML=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="2 3"/><circle cx="${x}" cy="${y}" r="7" fill="#ffd21f" stroke="var(--text)" stroke-width="2"/><text x="${flip?x-12:x+12}" y="${y-8}" text-anchor="${flip?'end':'start'}" style="font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px">${h}km · 약 ${Math.round(t)}℃</text>`;
}
const bmap={11:['대류권과 성층권의 경계(대류권계면)','성층권'],50:['성층권과 중간권의 경계(성층권계면)','중간권'],80:['중간권과 열권의 경계(중간권계면)','열권']};
function showAlt(){
 const msg=document.getElementById('altmsg'),raw=document.getElementById('alt').value.trim();
 if(raw===''){msg.textContent='고도를 입력해 주세요.';return;}
 const h=Number(raw);
 if(!isFinite(h)||h<0){msg.textContent='0 이상의 숫자를 입력해 주세요.';return;}
 if(h>1000){msg.textContent='';clearMarker();document.querySelectorAll('.layer,.special').forEach(g=>g.classList.remove('active'));info.innerHTML=`<div class="res"><div class="big">📍 ${h}km</div></div><h2>외권</h2><span class="range">1000km 이상</span><ul><li><span class="plain">기권을 벗어난 외권이에요.</span></li></ul>`;return;}
 msg.textContent='';
 const t=tempAt(h);
 show(layerAt(h),true);
 let n='';
 if(bmap[h])n+=`<div>${bmap[h][0]}예요. ${bmap[h][1]}으로 보여 줄게요.</div>`;
 if(h>=20&&h<=30)n+=`<button class="it go" data-sp="ozone"><span>오존층(20~30km)에 해당해요</span><span class="arr" style="transform:none">›</span></button>`;
 if(h===100)n+=`<button class="it go" data-sp="karman"><span>카르만 선(100km)이에요</span><span class="arr" style="transform:none">›</span></button>`;
 else if(h>100)n+=`<div>카르만 선(100km)보다 높아서 우주 영역이에요.</div>`;
 info.insertAdjacentHTML('afterbegin',`<div class="res"><div class="big">📍 ${h}km</div><div>기온 약 ${Math.round(t)}℃ <span class="sm">(그래프 기준)</span></div>${n}</div>`);
 info.querySelectorAll('.res .go').forEach(b=>b.addEventListener('click',()=>showSpecial(b.dataset.sp)));
 drawMarker(h,t);
}
document.getElementById('altgo').addEventListener('click',showAlt);
document.getElementById('alt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();showAlt();}});
</script>
</body>
</html>
